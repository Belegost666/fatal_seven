<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07050a">
<title>Le 7 Fatal</title>
<style>
  :root {
    --bg: radial-gradient(ellipse at 30% 20%, #1a0f2e 0%, #07050a 60%);
    --panel: rgba(18, 14, 28, 0.85);
    --border: rgba(255,255,255,0.06);
    --crimson: #f43f5e;
    --gold: #d4af37;
    --gold-text: #f0c060;
    --purple: #a855f7;
    --muted: #6b7280;
    --main: #f3f4f6;
    --success: #34d399;
    --radius: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background-color: #07050a;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--main);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    height: 100dvh;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .wrapper {
    width: 92%;
    max-width: 370px;
    background: var(--panel);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    padding: 24px 22px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset, 0 24px 60px rgba(0,0,0,0.8);
    transform: translateZ(0);
    position: relative;
  }

  .title-row { text-align: center; margin-bottom: 22px; position: relative; }
  h1 { font-size: 1.15rem; font-weight: 200; letter-spacing: 5px; text-transform: uppercase; color: var(--main); margin-bottom: 4px; }
  .subtitle { font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: var(--crimson); opacity: 0.85; }

  /* Indicateur Wake Lock : petite icône discrète en haut à droite, visible
     uniquement quand le verrou d'écran est actif. */
  .wakelock-badge {
    position: absolute;
    top: 0;
    right: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.55rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--success);
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }
  .wakelock-badge.visible { opacity: 0.85; transform: translateY(0); }
  .wakelock-badge svg { width: 11px; height: 11px; flex-shrink: 0; }

  .dashboard { display: flex; gap: 10px; margin-bottom: 22px; }
  .stat-box { flex: 1; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.04); border-radius: 14px; padding: 10px 0 8px; text-align: center; }
  .stat-label { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); display: block; margin-bottom: 5px; }
  .stat-val { font-size: 1.15rem; font-weight: 300; color: var(--gold-text); letter-spacing: 1px; }
  .score-bar-wrap { background: rgba(0,0,0,0.3); border-radius: 4px; height: 3px; margin: 6px 12px 0; overflow: hidden; }
  .score-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold) 0%, var(--gold-text) 100%); border-radius: 4px; transition: width 0.6s cubic-bezier(0.25,1,0.5,1); width: 0%; }

  .dice-container { display: flex; justify-content: center; gap: 22px; margin: 4px 0 22px; }
  .die-wrap { position: relative; width: 80px; height: 80px; }
  .die-wrap svg { width: 80px; height: 80px; border-radius: 18px; overflow: visible; }

  @keyframes rollAnim {
    0%   { transform: scale(1) rotate(0deg); }
    15%  { transform: scale(1.08) rotate(90deg); }
    35%  { transform: scale(1.12) rotate(270deg); }
    60%  { transform: scale(1.1) rotate(600deg); }
    80%  { transform: scale(1.04) rotate(900deg); }
    100% { transform: scale(1) rotate(1080deg); }
  }
  .rolling-die { animation: rollAnim 1.2s cubic-bezier(0.2,0.8,0.4,1) forwards; }

  @keyframes glowRing { 0% { opacity: 0; transform: scale(0.85); } 40% { opacity: 1; } 100% { opacity: 0; transform: scale(1.3); } }
  .glow-ring { position: absolute; inset: -6px; border-radius: 24px; pointer-events: none; opacity: 0; }
  .glow-gold   { box-shadow: 0 0 0 2px rgba(212,175,55,0.6);  animation: glowRing 0.8s ease forwards; }
  .glow-red    { box-shadow: 0 0 0 2px rgba(244,63,94,0.7);   animation: glowRing 0.8s ease forwards; }
  .glow-purple { box-shadow: 0 0 0 2px rgba(168,85,247,0.7);  animation: glowRing 0.8s ease forwards; }

  .info-panel { background: rgba(0,0,0,0.18); border: 1px solid rgba(255,255,255,0.03); border-radius: 16px; padding: 12px 15px; height: 102px; margin-bottom: 18px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 6px; }
  .info-tag { font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); background: rgba(255,255,255,0.04); padding: 3px 10px; border-radius: 20px; }
  .info-text { font-size: 0.85rem; font-weight: 300; line-height: 1.45; color: var(--main); }

  .t-danger  { color: var(--crimson);   font-weight: 500; }
  .t-success { color: var(--success);   font-weight: 500; }
  .t-bonus   { color: var(--purple);    font-weight: 500; }
  .t-gold    { color: var(--gold-text); font-weight: 500; }

  .timer-wrap { text-align: center; height: 74px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
  .timer-digits { font-size: 3rem; font-weight: 100; letter-spacing: 2px; color: var(--gold-text); font-variant-numeric: tabular-nums; }
  .timer-label { font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }

  .rounds-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .round-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.12); transition: all 0.3s ease; }
  .round-dot.done   { background: var(--gold); border-color: var(--gold); }
  .round-dot.active { background: transparent; border-color: var(--gold-text); box-shadow: 0 0 6px rgba(212,175,55,0.4); }

  .btn-main { width: 100%; background: transparent; border: 1px solid var(--gold); color: var(--gold-text); padding: 16px 28px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 2.5px; border-radius: 50px; cursor: pointer; transition: background 0.15s, transform 0.1s; }
  .btn-main:active:not(:disabled) { background: rgba(212,175,55,0.1); transform: scale(0.98); }
  .btn-main:disabled { border-color: rgba(255,255,255,0.06); color: var(--muted); cursor: default; }
  .btn-main.purple { border-color: var(--purple); color: var(--purple); }
  .btn-main:focus-visible { outline: 2px solid var(--gold-text); outline-offset: 2px; }

  /* Bouton skip : visible uniquement après un délai (protection anti-clic accidentel) */
  .btn-skip { opacity: 0; pointer-events: none; width: 100%; background: none; border: none; color: rgba(255,255,255,0.18); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 14px; padding: 8px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; transition: opacity 0.4s ease; }
  .btn-skip:focus-visible { outline: 1px solid rgba(255,255,255,0.3); outline-offset: 2px; }

  /* Bandeau d'avertissement si le verrou d'écran n'a pas pu être obtenu */
  .wakelock-warning {
    font-size: 0.6rem;
    text-align: center;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.4;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.3s ease, max-height 0.3s ease;
  }
  .wakelock-warning.visible { opacity: 0.8; max-height: 40px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="title-row">
    <h1>Le 7 Fatal</h1>
    <div class="wakelock-badge" id="wakelock-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55 10.94 10.94 0 011 12.55a10.94 10.94 0 015.17-6.39M9.9 4.24A10.94 10.94 0 0112 4c1.55 0 3.04.34 4.39.98" stroke-linecap="round" stroke-linejoin="round" style="display:none"/>
        <circle cx="12" cy="12" r="3"/>
        <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>
      </svg>
      <span>Écran actif</span>
    </div>
  </div>

  <div class="dashboard">
    <div class="stat-box">
      <span class="stat-label">Score</span>
      <span class="stat-val" id="ui-score">0 / 35</span>
      <div class="score-bar-wrap"><div class="score-bar-fill" id="score-bar"></div></div>
    </div>
    <div class="stat-box">
      <span class="stat-label">Rounds</span>
      <span class="stat-val" id="ui-lancers">0 / 5</span>
    </div>
  </div>

  <div class="rounds-row">
    <div class="round-dot active" id="rd0"></div>
    <div class="round-dot" id="rd1"></div>
    <div class="round-dot" id="rd2"></div>
    <div class="round-dot" id="rd3"></div>
    <div class="round-dot" id="rd4"></div>
  </div>

  <div class="dice-container">
    <div class="die-wrap" id="die-wrap-1">
      <div class="glow-ring" id="glow1"></div>
      <svg id="d1" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="die-wrap" id="die-wrap-2">
      <div class="glow-ring" id="glow2"></div>
      <svg id="d2" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <div class="info-panel">
    <div class="info-tag" id="ui-tag">Statut</div>
    <div class="info-text" id="ui-text" aria-live="polite">Prêt ? Lancez les dés pour démarrer le Round 1.</div>
  </div>

  <div class="timer-wrap" id="timer-wrap">
    <div class="timer-digits" id="ui-timer">00:00</div>
    <div class="timer-label">Restant</div>
  </div>

  <button class="btn-main" id="ui-btn" onclick="G.click()">Lancer les dés</button>
  <button class="btn-skip" id="ui-skip" onclick="G.skip()">Passer le chrono</button>
  <div class="wakelock-warning" id="wakelock-warning">
    Le maintien d'écran n'est pas disponible sur ce navigateur. Pensez à désactiver la mise en veille automatique.
  </div>
</div>

<script>
'use strict';

const WIN = 35;
const STORAGE_KEY = 'le7fatal_save_v1';

const DOTS = {
  1: [[40,40]],
  2: [[22,22],[58,58]],
  3: [[22,22],[40,40],[58,58]],
  4: [[22,22],[58,22],[22,58],[58,58]],
  5: [[22,22],[58,22],[40,40],[22,58],[58,58]],
  6: [[22,20],[58,20],[22,40],[58,40],[22,60],[58,60]]
};

function renderDie(svgEl, value) {
  const isQ = value === '?';
  let inner = `<rect x="2" y="2" width="76" height="76" rx="16" fill="#0a0814" stroke="${isQ ? 'rgba(255,255,255,0.1)' : 'rgba(212,175,55,0.35)'}" stroke-width="${isQ ? 1 : 1.5}"/>`;
  if (isQ) {
    inner += `<text x="40" y="50" text-anchor="middle" font-size="32" font-weight="200" fill="#c49a2a" font-family="-apple-system,sans-serif">?</text>`;
  } else {
    DOTS[value].forEach(([cx,cy]) => { inner += `<circle cx="${cx}" cy="${cy}" r="5.5" fill="#e8b84b"/>`; });
  }
  svgEl.innerHTML = inner;
}

function animDots(svgEl) {
  const seq = [1,2,3,4,5,6,1,2,3,4,5,6];
  let i = 0;
  return setInterval(() => { renderDie(svgEl, seq[i++ % seq.length]); }, 80);
}

// ─────────────────────────────────────────────────────────────────────────
// Gestionnaire Wake Lock
//
// Empêche l'écran de s'éteindre pendant les phases de chrono (EDGING /
// BONUS_TIMER). Repose sur l'API native Screen Wake Lock, supportée par
// Chrome/Edge/Opera (Android & desktop) et Safari iOS ≥ 16.4. Si l'API
// n'existe pas (anciens navigateurs, certains navigateurs in-app), on
// affiche un message discret invitant l'utilisateur à désactiver la mise
// en veille manuellement — le jeu reste pleinement fonctionnel sans elle.
//
// Particularité à gérer : le verrou est automatiquement relâché par le
// navigateur quand l'onglet passe en arrière-plan (changement d'app, écran
// verrouillé). Il faut donc le ré-acquérir au retour si une phase de chrono
// est toujours active — sinon l'écran pourrait s'éteindre au second passage
// en arrière-plan sans qu'on s'en rende compte.
// ─────────────────────────────────────────────────────────────────────────
class WakeLockManager {
  constructor() {
    this.sentinel   = null;
    this.supported  = 'wakeLock' in navigator;
    this.badge      = document.getElementById('wakelock-badge');
    this.warning    = document.getElementById('wakelock-warning');

    if (!this.supported) {
      this.warning.classList.add('visible');
    }

    // Ré-acquisition automatique au retour au premier plan
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && this._shouldHold && !this.sentinel) {
        this.acquire();
      }
    });
  }

  async acquire() {
    if (!this.supported) return;
    this._shouldHold = true;
    try {
      this.sentinel = await navigator.wakeLock.request('screen');
      this.badge.classList.add('visible');
      this.sentinel.addEventListener('release', () => {
        // Le navigateur a libéré le verrou de son propre chef (mise en
        // arrière-plan, batterie faible sur certains appareils, etc.)
        this.sentinel = null;
        this.badge.classList.remove('visible');
      });
    } catch (err) {
      // Échec possible : permission refusée, contrainte système (batterie),
      // ou navigateur in-app restreint. On se contente du bandeau informatif.
      this.sentinel = null;
      this.badge.classList.remove('visible');
      this.warning.classList.add('visible');
    }
  }

  async release() {
    this._shouldHold = false;
    if (this.sentinel) {
      try { await this.sentinel.release(); } catch (err) { /* déjà relâché */ }
      this.sentinel = null;
    }
    this.badge.classList.remove('visible');
  }
}

// ─────────────────────────────────────────────
// Phases :
//   ROLL         → attente du lancer ordinaire
//   EDGING       → chrono entre deux rounds
//   BONUS_ROLL   → attente du lancer bonus
//   BONUS_TIMER  → chrono après double réussi (séparé de EDGING pour éviter
//                  toute confusion de contexte au moment du skip/fin)
//   END          → partie terminée
// ─────────────────────────────────────────────
class Game {
  constructor() {
    this.score    = 0;
    this.lancers  = 0;
    this.phase    = 'ROLL';
    this.timer    = null;     // ID de l'intervalle en cours, null si aucun
    this.endsAt   = null;     // timestamp epoch (ms) de fin de chrono — base
                               // de calcul anti-dérive, indépendante des
                               // setInterval qui peuvent être throttlés.
    this.d1       = 0;
    this.d2       = 0;
    this._a1      = null;     // IDs des animations de dés (anti double-tap)
    this._a2      = null;
    this._skipDelayTimer = null;
    this.wakeLock = new WakeLockManager();

    this.restoreFromStorage();
  }

  get total() { return this.d1 + this.d2; }

  vib(p) { if ('vibrate' in navigator) { try { navigator.vibrate(p); } catch (e) { /* ignoré */ } } }

  click() {
    if      (this.phase === 'ROLL')       this.roll(false);
    else if (this.phase === 'BONUS_ROLL') this.roll(true);
    else if (this.phase === 'END')        this.reset();
  }

  roll(isBonus) {
    const btn = document.getElementById('ui-btn');
    const s1  = document.getElementById('d1');
    const s2  = document.getElementById('d2');

    // Sécurité double-tap : on nettoie les animations précédentes si elles tournaient encore
    clearInterval(this._a1);
    clearInterval(this._a2);

    btn.disabled = true;
    s1.classList.add('rolling-die');
    s2.classList.add('rolling-die');

    this._a1 = animDots(s1);
    this._a2 = animDots(s2);

    let rv = setInterval(() => this.vib(15), 70);
    this.setTag('Lancer en cours…');
    this.setText('Mélange des dés...');

    setTimeout(() => {
      clearInterval(rv);
      clearInterval(this._a1); this._a1 = null;
      clearInterval(this._a2); this._a2 = null;
      s1.classList.remove('rolling-die');
      s2.classList.remove('rolling-die');

      let r1, r2;
      if (isBonus) {
        // Lancer bonus : pas de restriction
        r1 = Math.floor(Math.random()*6)+1;
        r2 = Math.floor(Math.random()*6)+1;
      } else {
        // Round 1 uniquement : on interdit le 7 d'entrée de jeu
        // (this.lancers est encore 0 avant l'incrémentation ci-dessous)
        do {
          r1 = Math.floor(Math.random()*6)+1;
          r2 = Math.floor(Math.random()*6)+1;
        } while (this.lancers === 0 && r1+r2 === 7);
      }

      this.d1 = r1; this.d2 = r2;
      renderDie(s1, r1);
      renderDie(s2, r2);

      if (isBonus) this.evalBonus();
      else { this.lancers++; this.evalRules(); }

      this.persist();
    }, 1200);
  }

  evalRules() {
    this.updateDots();

    // ── 7 fatal ──────────────────────────────────────────────────────────
    if (this.total === 7) {
      this.phase = 'END';
      this.triggerGlow('red');
      this.vib([300,100,300,100,500]);
      this.setTag(`Résultat : ${this.d1} + ${this.d2} = 7`);
      this.setText(`<span class="t-danger">7 !</span> Session terminée immédiatement. <span class="t-danger">Interdiction de jouir.</span>`);
      this.updateUI();
      return;
    }

    this.score += this.total;
    this.triggerGlow('gold');

    // ── Score de victoire atteint ─────────────────────────────────────────
    // Testé AVANT la vérification lancers === 5, pour que le round 5 gagnant
    // déclenche bien le message victoire et non le message "dernier round".
    if (this.score >= WIN) {
      this.phase = 'EDGING';
      this.vib([100,50,100,50,100,50,400]);
      this.setTag(`Victoire en vue ! · +${this.total} pts`);
      this.setText(`<span class="t-success">Score de ${this.score}/${WIN} atteint !</span><br>Masturbez-vous pendant <b>${this.total} minutes</b>. Vous aurez le droit de jouir à la fin du chrono !`);
      this.updateUI();
      this.startTimer(this.total * 60);
      return;
    }

    // ── Rounds normaux ────────────────────────────────────────────────────
    this.phase = 'EDGING';
    this.vib(80);
    this.setTag(`Round ${this.lancers} / 5 · +${this.total} pts`);

    if (this.lancers === 1) {
      this.setText(`<span class="t-gold">Premier round</span><br>Commencez avec <b>${this.total}</b> — soit <b>${this.total} minutes</b> de masturbation sans jouir.`);
    } else if (this.lancers === 5) {
      this.setText(`Score : ${this.score}/${WIN}.<br><span class="t-danger">Dernier round :</span> Masturbez-vous pendant <b>${this.total} min</b> avant le verdict final.`);
    } else {
      this.setText(`<span class="t-gold">Consigne :</span> Masturbez-vous sans jouir pendant <b>${this.total} minutes</b>.`);
    }
    this.updateUI();
    this.startTimer(this.total * 60);
  }

  evalBonus() {
    this.setTag(`Lancer bonus : ${this.d1} + ${this.d2}`);

    if (this.d1 === this.d2) {
      // Double réussi → chrono bonus dans une phase dédiée BONUS_TIMER
      this.phase = 'BONUS_TIMER';
      this.triggerGlow('purple');
      this.vib([200,100,200,100,200]);
      this.setText(`<span class="t-bonus">Double réussi (${this.d1}×2) !</span><br>Le hasard a eu pitié. Masturbez-vous pendant <b>${this.total} minutes</b> avant d'accéder à votre orgasme ruiné.`);
      this.updateUI();
      this.startTimer(this.total * 60);
    } else {
      // Pas de double → fin immédiate
      this.phase = 'END';
      this.triggerGlow('red');
      this.vib([600]);
      this.setText(`<span class="t-danger">Échec du double.</span><br>Session terminée. <span class="t-danger">Vous n'êtes pas autorisé à jouir !</span>`);
      this.updateUI();
    }
  }

  triggerGlow(type) {
    ['glow1','glow2'].forEach(id => {
      const el = document.getElementById(id);
      el.className = 'glow-ring';
      void el.offsetWidth; // force reflow pour relancer l'animation
      el.className = `glow-ring glow-${type}`;
    });
  }

  startTimer(s) {
    // Nettoyer tout timer précédent avant d'en démarrer un nouveau
    clearInterval(this.timer);
    this.timer = null;

    // Base de temps absolue : on calcule le temps restant à partir d'un
    // timestamp de fin plutôt que de décrémenter un compteur à chaque tick.
    // Cela évite toute dérive si le thread JS est throttlé en arrière-plan,
    // et permet de retrouver le temps restant exact après un reload de page.
    this.endsAt = Date.now() + s * 1000;

    // Le verrou d'écran ne doit vivre que pendant un chrono actif.
    this.wakeLock.acquire();

    // Délai de 5 s avant que le bouton "Passer" devienne accessible
    clearTimeout(this._skipDelayTimer);
    const sk = document.getElementById('ui-skip');
    sk.style.opacity = '0';
    sk.style.pointerEvents = 'none';
    this._skipDelayTimer = setTimeout(() => {
      // On vérifie que le chrono tourne encore (pas déjà terminé)
      if (this.phase === 'EDGING' || this.phase === 'BONUS_TIMER') {
        sk.style.opacity = '1';
        sk.style.pointerEvents = 'auto';
      }
    }, 5000);

    this.persist();
    this.renderTimerTick();

    this.timer = setInterval(() => this.renderTimerTick(), 250);
  }

  // Calcule le temps restant à partir de endsAt et met à jour l'affichage.
  // Appelé à intervalle régulier ET juste après un reload pour resynchroniser
  // l'affichage avant même le premier tick.
  renderTimerTick() {
    const remainingMs = this.endsAt - Date.now();
    const remainingS = Math.max(0, Math.ceil(remainingMs / 1000));
    const fmt = n => `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
    document.getElementById('ui-timer').innerText = fmt(remainingS);
    if (remainingMs <= 0) this.endTimer();
  }

  endTimer() {
    clearInterval(this.timer);
    this.timer = null;
    this.endsAt = null;
    clearTimeout(this._skipDelayTimer);
    this.wakeLock.release();

    // Cacher immédiatement le bouton skip
    const sk = document.getElementById('ui-skip');
    sk.style.opacity = '0';
    sk.style.pointerEvents = 'none';

    this.vib([150,100,150]);

    // ── Victoire : score atteint, chrono validé ───────────────────────────
    if (this.score >= WIN) {
      this.phase = 'END';
      this.setTag(`Victoire — Score final : ${this.score} / ${WIN}`);
      this.setText(`<span class="t-success">Félicitations ! Temps validé.</span><br><span class="t-success" style="font-size:1.1rem; font-weight:bold; display:block; margin-top:8px;">VOUS AVEZ LE DROIT DE JOUIR !</span>`);
      this.updateUI();
      this.persist();
      return;
    }

    // ── Fin du chrono bonus (phase BONUS_TIMER) ───────────────────────────
    // Séparé de EDGING pour éviter que le skip du bonus se rabatte sur les
    // dés du round 5 (this.d1/d2 seraient ceux du round 5, pas du bonus).
    if (this.phase === 'BONUS_TIMER') {
      this.phase = 'END';
      this.setTag('Bonus validé !');
      this.setText(`<span class="t-bonus">Temps bonus écoulé !</span><br>Vous avez gagné le droit à votre <span class="t-bonus">orgasme ruiné</span>. Masturbez-vous jusqu'à l'orgasme, puis stoppez toute stimulation au dernier instant.`);
      this.updateUI();
      this.persist();
      return;
    }

    // ── Fin du dernier round, score insuffisant ───────────────────────────
    if (this.lancers >= 5 && this.score < WIN) {
      this.phase = 'BONUS_ROLL';
      this.setTag('Verdict : score insuffisant');
      this.setText(`Fin des 5 rounds. Votre score est insuffisant : ${this.score}/${WIN}.<br><span class="t-bonus">Lancer bonus :</span> Tentez un double pour un orgasme ruiné !`);
      this.updateUI();
      this.persist();
      return;
    }

    // ── Fin de chrono inter-round : relancer ──────────────────────────────
    this.phase = 'ROLL';
    this.setTag('Chrono terminé');
    this.setText('Temps validé. Relancez les dés sans attendre.');
    this.updateUI();
    this.persist();
  }

  skip() {
    clearInterval(this.timer);
    this.timer = null;
    this.endsAt = Date.now(); // force un temps restant nul pour endTimer()
    this.endTimer();
  }

  updateDots() {
    for (let i = 0; i < 5; i++) {
      const d = document.getElementById(`rd${i}`);
      if      (i < this.lancers)  d.className = 'round-dot done';
      else if (i === this.lancers) d.className = 'round-dot active';
      else                        d.className = 'round-dot';
    }
  }

  updateUI() {
    document.getElementById('ui-score').innerText   = `${this.score} / ${WIN}`;
    document.getElementById('ui-lancers').innerText = `${this.lancers} / 5`;
    document.getElementById('score-bar').style.width = `${Math.min(this.score / WIN * 100, 100)}%`;

    const btn = document.getElementById('ui-btn');
    const tw  = document.getElementById('timer-wrap');
    const sk  = document.getElementById('ui-skip');

    btn.className = 'btn-main';

    switch (this.phase) {
      case 'ROLL':
        btn.innerText      = 'Lancer les dés';
        btn.disabled       = false;
        tw.style.opacity   = '0';
        tw.style.pointerEvents = 'none';
        sk.style.opacity   = '0';
        sk.style.pointerEvents = 'none';
        break;

      case 'EDGING':
      case 'BONUS_TIMER':
        btn.innerText      = 'Session en cours…';
        btn.disabled       = true;
        tw.style.opacity   = '1';
        tw.style.pointerEvents = 'auto';
        // Le bouton skip est géré par startTimer() avec son délai de 5 s —
        // on ne le force pas ici pour ne pas court-circuiter le délai.
        break;

      case 'BONUS_ROLL':
        btn.innerText      = 'Lancer bonus — Dernière chance';
        btn.disabled       = false;
        btn.className      = 'btn-main purple';
        tw.style.opacity   = '0';
        tw.style.pointerEvents = 'none';
        sk.style.opacity   = '0';
        sk.style.pointerEvents = 'none';
        break;

      case 'END':
        btn.innerText      = 'Recommencer une partie';
        btn.disabled       = false;
        tw.style.opacity   = '0';
        tw.style.pointerEvents = 'none';
        sk.style.opacity   = '0';
        sk.style.pointerEvents = 'none';
        break;
    }
  }

  setTag(t) { document.getElementById('ui-tag').innerText  = t; }
  setText(h) { document.getElementById('ui-text').innerHTML = h; }

  // ── Persistance ──────────────────────────────────────────────────────
  // Sauvegarde l'état minimal nécessaire pour reprendre une session après
  // un reload accidentel (navigation, crash de l'onglet, etc.). On ne
  // sauvegarde pas les phases transitoires de lancer (l'animation des dés
  // n'a pas besoin d'être restaurée).
  persist() {
    try {
      const snapshot = {
        score: this.score,
        lancers: this.lancers,
        phase: this.phase,
        d1: this.d1,
        d2: this.d2,
        endsAt: this.endsAt
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
    } catch (e) {
      // Stockage indisponible (navigation privée, quota) : tant pis, le
      // jeu fonctionne simplement sans persistance entre sessions.
    }
  }

  restoreFromStorage() {
    let snapshot = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) snapshot = JSON.parse(raw);
    } catch (e) {
      snapshot = null;
    }

    if (!snapshot) {
      renderDie(document.getElementById('d1'), '?');
      renderDie(document.getElementById('d2'), '?');
      return;
    }

    this.score   = snapshot.score   ?? 0;
    this.lancers = snapshot.lancers ?? 0;
    this.phase   = snapshot.phase   ?? 'ROLL';
    this.d1      = snapshot.d1      ?? 0;
    this.d2      = snapshot.d2      ?? 0;

    if (this.d1 && this.d2) {
      renderDie(document.getElementById('d1'), this.d1);
      renderDie(document.getElementById('d2'), this.d2);
    } else {
      renderDie(document.getElementById('d1'), '?');
      renderDie(document.getElementById('d2'), '?');
    }

    this.updateDots();

    // Si un chrono était en cours, on calcule le temps restant réel.
    // S'il s'est déjà écoulé pendant l'absence, on déclenche endTimer
    // immédiatement pour faire avancer le jeu à l'état suivant.
    if ((this.phase === 'EDGING' || this.phase === 'BONUS_TIMER') && snapshot.endsAt) {
      this.endsAt = snapshot.endsAt;
      const remainingMs = this.endsAt - Date.now();

      if (remainingMs <= 0) {
        this.setTag('Reprise de session');
        this.updateUI();
        this.endTimer();
      } else {
        this.setTag('Session reprise');
        this.setText('Chrono restauré après une interruption.');
        this.updateUI();
        this.wakeLock.acquire();

        const sk = document.getElementById('ui-skip');
        this._skipDelayTimer = setTimeout(() => {
          if (this.phase === 'EDGING' || this.phase === 'BONUS_TIMER') {
            sk.style.opacity = '1';
            sk.style.pointerEvents = 'auto';
          }
        }, 5000);

        this.renderTimerTick();
        this.timer = setInterval(() => this.renderTimerTick(), 250);
      }
    } else {
      // États sans chrono actif : on réaffiche simplement le texte adapté
      // à la phase pour ne pas perdre le contexte au reload.
      if (this.phase === 'BONUS_ROLL') {
        this.setTag('Verdict : score insuffisant');
        this.setText(`Fin des 5 rounds. Votre score est insuffisant : ${this.score}/${WIN}.<br><span class="t-bonus">Lancer bonus :</span> Tentez un double pour un orgasme ruiné !`);
      } else if (this.phase === 'END') {
        this.setTag('Partie terminée');
        this.setText('Session précédente terminée. Lancez une nouvelle partie.');
      } else {
        this.setTag('Statut');
        this.setText('Prêt ? Lancez les dés pour démarrer le Round 1.');
      }
      this.updateUI();
    }
  }

  reset() {
    this.score   = 0;
    this.lancers = 0;
    this.phase   = 'ROLL';
    this.d1      = 0;
    this.d2      = 0;
    this.endsAt  = null;

    // Nettoyage complet de tous les timers/intervalles actifs
    clearInterval(this.timer);       this.timer   = null;
    clearInterval(this._a1);         this._a1     = null;
    clearInterval(this._a2);         this._a2     = null;
    clearTimeout(this._skipDelayTimer); this._skipDelayTimer = null;
    this.wakeLock.release();

    renderDie(document.getElementById('d1'), '?');
    renderDie(document.getElementById('d2'), '?');
    document.getElementById('score-bar').style.width = '0%';

    this.setTag('Statut');
    this.setText('Nouvelle partie. Lancez les dés pour démarrer le Round 1.');

    // updateDots() centralise la logique — pas de boucle dupliquée
    this.updateDots();
    this.updateUI();

    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignoré */ }
  }
}

const G = new Game();
</script>
</body>
</html>
